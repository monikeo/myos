<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyOS</title>
    
    <!-- Client-Side Content Security Policy (CSP) Hardening -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' wss: ws: https:; frame-src 'self' https://drive.google.com https://docs.google.com;" />
    
    <!-- PWA & Apple Standalone Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="MyOS - Personal Operating System & Enterprise Workspace Management Platform by Keo Moni" />
    <meta name="author" content="Keo Moni" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MyOS — Personal Operating System" />
    <meta property="og:description" content="Decoupled workspace hub, task pipelines, finance tracking, and Google Drive vault." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyOS — Personal Operating System" />
    <meta name="twitter:description" content="Decoupled workspace hub, task pipelines, finance tracking, and Google Drive vault." />
    <meta name="twitter:image" content="/logo.png" />
    
    <!-- Branding Favicons & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Font Preconnects for Instant Type Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem("myos_theme") || "dark";
          var isDark = false;
          if (theme === "dark") {
            isDark = true;
          } else if (theme === "system") {
            isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Global PWA Install Prompt Listener
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent("myos:pwa-installable"));
      });
      window.addEventListener("appinstalled", () => {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent("myos:pwa-installed"));
        console.log("[PWA] Application installed successfully");
      });

      // Service Worker registration for PWA installation and offline caching
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => console.log("[PWA] Service Worker registered:", reg.scope))
            .catch((err) => console.warn("[PWA] Service Worker registration note:", err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
